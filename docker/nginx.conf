server {
    listen 80;
    server_name localhost;

    # API endpoints (placeholder responses for development)
    location /api/ {
        add_header Content-Type application/json;
        
        # Dashboard stats
        location /api/dashboard/stats {
            return 200 '{"totalProducts":1248,"totalUsers":15672,"totalOrders":8945,"totalRevenue":125630.50,"growthRate":12.5,"activeOffers":8,"activeBanners":5,"lowStockProducts":23}';
        }
        
        # Default API response
        return 200 '{"message":"API endpoint not implemented yet","timestamp":"2024-01-01T00:00:00Z"}';
    }

    # Health check
    location /health {
        return 200 '{"status":"ok","service":"nginx-api-gateway"}';
    }

    # Default location
    location / {
        return 200 '{"message":"API Gateway is running","endpoints":["/api/dashboard/stats","/health"]}';
    }
}